<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Base Converter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <style>
        body { 
            background-color: black; 
            color: white;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        .converter-container { 
            position: relative;
            max-width: 500px; 
            margin: auto; 
            padding: 20px; 
            border-radius: 10px; 
            background: rgba(255, 255, 255, 0.1); 
            box-shadow: 0px 0px 15px rgba(0, 255, 0, 0.5); 
            backdrop-filter: blur(5px);
        }
        .btn-convert { background-color: #007bff; color: white; font-weight: bold; }
        .btn-convert:hover { background-color: #0056b3; }
        #result-box { background: #222; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; }
        
        /* Matrix Background */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <div class="container mt-5">
        <div class="converter-container">
            <h3 class="text-center mb-3">Number Base Converter</h3>
            <div class="mb-3">
                <label class="form-label">Enter Number:</label>
                <input type="text" id="number" class="form-control" placeholder="Enter number...">
            </div>
            <div class="mb-3">
                <label class="form-label">From Base (2-36):</label>
                <input type="number" id="fromBase" class="form-control" min="2" max="36" placeholder="e.g. 10">
            </div>
            <div class="mb-3">
                <label class="form-label">To Base (2-36):</label>
                <input type="number" id="toBase" class="form-control" min="2" max="36" placeholder="e.g. 2">
            </div>
            <button class="btn btn-convert w-100" onclick="convertBase()">Convert</button>
            <div class="mt-3">
                <p id="result-box">Result: <span id="result">--</span></p>
            </div>
        </div>
    </div>

    <script>
        function convertBase() {
            let num = document.getElementById("number").value.trim();
            let fromBase = parseInt(document.getElementById("fromBase").value);
            let toBase = parseInt(document.getElementById("toBase").value);

            if (!num || isNaN(fromBase) || isNaN(toBase) || fromBase < 2 || fromBase > 36 || toBase < 2 || toBase > 36) {
                document.getElementById("result").innerText = "Invalid Input";
                return;
            }
            
            try {
                let decimalNumber = parseInt(num, fromBase);
                let result = decimalNumber.toString(toBase).toUpperCase();
                document.getElementById("result").innerText = result;
            } catch (error) {
                document.getElementById("result").innerText = "Conversion Error";
            }
        }

        // Matrix Background Effect
        const canvas = document.getElementById("matrixCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const characters = "01";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(0);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);
    </script>
</body>
</html>
